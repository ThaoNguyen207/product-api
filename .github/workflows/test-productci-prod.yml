name: Product API Production CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/product_db_ci
        run: |
          # 1. Khởi chạy Server ngầm
          node index.js &
          
          # 2. Vòng lặp chờ Server sẵn sàng
          echo "Waiting for API server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q '"status":"UP"'; then
              echo "API is UP and ready!"
              break
            fi
            echo "Waiting..."
            sleep 1
          done

          # 3. Kiểm thử Endpoint Healthcheck
          echo "Testing GET /health..."
          curl -f http://localhost:3000/health

          # 4. Kiểm thử danh sách sản phẩm (READ)
          echo -e "\nTesting GET /api/products..."
          curl -s http://localhost:3000/api/products || curl -s http://localhost:3000/products || true

          # 5. Kiểm thử tạo sản phẩm mới (CREATE - Không ngắt pipeline nếu sai validation)
          echo -e "\nTesting POST /api/products..."
          curl -s -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"P999","pname":"Test Product","price":100,"quantity":5}' || true