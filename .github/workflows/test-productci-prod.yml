name: Product API Production CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/product_db_ci
        run: |
          # Khởi chạy server API ngầm
          node index.js &
          
          # Vòng lặp chờ Server phản hồi 200 tại /health (tối đa 30 giây)
          echo "Waiting for API server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q '"status":"UP"'; then
              echo "API is UP and ready!"
              break
            fi
            echo "Waiting..."
            sleep 1
          done

          # Test 1: GET /health
          echo "Testing GET /health..."
          curl -f http://localhost:3000/health

          # Test 2: POST /api/products
          echo -e "\nTesting POST /api/products..."
          curl -f -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid": "P999", "pname": "CI Test Product", "price": 100, "quantity": 5}'

          # Test 3: GET /api/products
          echo -e "\nTesting GET /api/products..."
          curl -f http://localhost:3000/api/products

          # Test 4: DELETE /api/products/P999
          echo -e "\nTesting DELETE /api/products/P999..."
          curl -f -X DELETE http://localhost:3000/api/products/P999