name: Product API Production CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/product_db_ci
        run: |
          # Khởi chạy server API ngầm
          node index.js &
          
          # Đợi server khởi động thành công và phản hồi HTTP 200 tại /health
          npx wait-on http://localhost:3000/health -t 30000

          echo "Testing GET /health..."
          curl -f http://localhost:3000/health

          echo -e "\nTesting POST /api/products..."
          curl -f -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid": "P999", "pname": "CI Test Product", "price": 100, "quantity": 5}'

          echo -e "\nTesting GET /api/products..."
          curl -f http://localhost:3000/api/products

          echo -e "\nTesting DELETE /api/products/P999..."
          curl -f -X DELETE http://localhost:3000/api/products/P999