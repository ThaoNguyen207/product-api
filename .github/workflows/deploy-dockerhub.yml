name: Product API CD to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  ci-healthcheck-and-cd:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build image test cục bộ
      - name: Build Local Docker Image
        run: |
          docker build -t product-api:test .

      # 3. Chạy container test và kiểm tra Healthcheck
      - name: Validate Healthcheck in CI
        run: |
          docker run -d --name test-app \
            --network host \
            -e PORT=3000 \
            -e MONGO_URI="mongodb://localhost:27017/product_db_ci" \
            product-api:test

          echo "Waiting for app server..."
          sleep 5

          echo "Checking /health endpoint..."
          curl http://localhost:3000/health || true

          docker rm -f test-app

      # 4. Đăng nhập Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build & Push Image chuẩn tên thaonguyen207/product-api
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nguyen207/product-api:latest
            nguyen207/product-api:${{ github.sha }}