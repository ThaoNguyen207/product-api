name: Product API CD to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  ci-healthcheck-and-cd:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Docker Image ứng dụng cục bộ trên Runner
      - name: Build Local Docker Image
        run: |
          docker build -t product-api:test .

      # 3. Khởi chạy Container & Kiểm tra Healthcheck trong CI
      - name: Validate Healthcheck in CI
        env:
          PORT: 3000
          MONGO_URI: mongodb://mongodb:27017/product_db_ci
        run: |
          # Kết nối container app vào mạng với MongoDB service
          docker run -d --name test-app \
            --network host \
            -e PORT=3000 \
            -e MONGO_URI="mongodb://localhost:27017/product_db_ci" \
            product-api:test

          # Vòng lặp chờ Healthcheck phản hồi UP
          echo "Waiting for Docker container healthcheck..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q '"status":"UP"'; then
              echo "Healthcheck passed: Container is healthy!"
              break
            fi
            echo "Waiting for app to start..."
            sleep 1
          done

          # Verify endpoint healthcheck trực tiếp
          curl -f http://localhost:3000/health

          # Dọn dẹp container test
          docker rm -f test-app

      # 4. Đăng nhập Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build & Push Image lên Docker Hub (CD Phase)
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
