name: Product API CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn từ Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Cài đặt dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Kiểm tra cấu trúc file và tính hợp lệ của mã nguồn
      - name: Check project files
        run: |
          node -v
          npm -v
          ls -la
